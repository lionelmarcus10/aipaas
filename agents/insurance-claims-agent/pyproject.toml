[project]
name = "insurance-claims-agent"
version = "0.1.0"
description = "A2 Insurance Claims Triage Agent — autonomous ReAct agent with Strands + Bedrock"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[ollama,openai]>=1.53.0",
    "strands-agents-tools>=0.8.1",
    # cast is installed separately from libs/custom-aws-strands-toolkit
    # (see Dockerfile or: pip install -e ../../libs/custom-aws-strands-toolkit)
    "cast",
    "faker>=30.0.0",
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    # RAG (optional — install separately if you need RAG):
    #   uv pip install faiss-cpu sentence-transformers
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_claims_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires OLLAMA_API_KEY for real LLM calls",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
