[project]
name = "cast"
version = "0.1.0"
description = "Custom AWS Strands Toolkit — wrapper for rapid agent development"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[ollama,openai]>=1.53.0",
    "strands-agents-tools>=0.8.1",
    "strands-agents-mcp-server>=0.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
