# vLLM raw manifests — k3d CPU mode
# Model: Qwen2.5-0.5B-Instruct (0.5B params, ~1 GB RAM in float16)
# Small enough for CPU-only k3d. Good enough for structured JSON reasoning.
# Switch to AWS GPU: change image tag, model, resources, and add GPU limits

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: aipaas
  labels:
    app: vllm
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        environment: dev
    spec:
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:latest-x86_64
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          env:
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: auto
            - name: VLLM_CPU_MEM_BINDING
              value: "disabled"
            - name: HF_HOME
              value: /root/.cache/huggingface
          command:
            - vllm
            - serve
            - Qwen/Qwen2.5-0.5B-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - half
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "1"
            - --enforce-eager
            - --gpu-memory-utilization
            - "0.3"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 20
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
        - name: hf-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: aipaas
  labels:
    app: vllm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: vllm
