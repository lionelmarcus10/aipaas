# Default deny-all NetworkPolicies for every workload namespace.
#
# Zero-trust model: every namespace gets a deny-all for ingress AND egress.
# Traffic is then re-enabled by explicit allow policies in the allow/ directory.
#
# IMPORTANT: A deny-all only affects pods that are selected by at least one
# NetworkPolicy in the namespace. If a namespace has NO NetworkPolicy at all,
# all traffic remains allowed (Kubernetes default = allow-all).
# The deny-all below selects all pods in the namespace (empty podSelector = match all)
# and specifies no ingress/egress rules, which blocks everything.

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

