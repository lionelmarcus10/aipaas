# Patch EKS pour insurance-claims-agent
# Strategic merge patch: seulement les champs qui changent par rapport à la base k3d.
---
# 1. Deployment — image ECR, pas de gVisor, RAG S3 Vectors, LLM Bedrock
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-claims-agent
  namespace: insurance-claims-agent
spec:
  template:
    spec:
      runtimeClassName: null
      initContainers:
        - name: setup-db
          image: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/insurance-claims-agent:latest
          env:
            - name: DB_LOCAL_PATH
              value: "/data/insurance_claims.duckdb"
            - name: RAG_PROVIDER
              value: "s3vectors"
            - name: RAG_EMBEDDING_PROVIDER
              value: "bedrock"
            - name: VECTOR_BUCKET_NAME
              value: "aipaas-rag-vectors"
            - name: VECTOR_INDEX_NAME
              value: "policy-chunks"
            - name: HF_HOME
              value: "/tmp/hf_cache"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_cache"
      containers:
        - name: orchestrator
          image: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/insurance-claims-agent:latest
          env:
            - name: LLM_PROVIDER
              value: "bedrock"
            - name: AWS_BEDROCK_REGION
              value: "eu-west-3"
            - name: BEDROCK_MODEL_ID
              value: "global.anthropic.claude-sonnet-4-6"
            - name: RAG_PROVIDER
              value: "s3vectors"
            - name: RAG_EMBEDDING_PROVIDER
              value: "bedrock"
            - name: VECTOR_BUCKET_NAME
              value: "aipaas-rag-vectors"
            - name: VECTOR_INDEX_NAME
              value: "policy-chunks"
            - name: DB_LOCAL_PATH
              value: "/app/data/insurance_claims.duckdb"
            - name: HF_HOME
              value: "/tmp/hf_cache"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_cache"
---
# 2. PVC — gp3 (EBS) au lieu de local-path, ReadWriteOnce
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duckdb-pvc
  namespace: insurance-claims-agent
spec:
  storageClassName: gp3
