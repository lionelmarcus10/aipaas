# RuntimeClass — gVisor (runsc)
# gVisor intercepte les syscalls en userspace (Go).
# Isolation syscall — plus léger que Kata (pas de VM) mais moins complet.
#
# Prérequis: les binaires runsc + containerd-shim-runsc-v1 doivent être
# installés sur les nodes. Contrairement à Kata, gVisor n'est PAS dans
# l'AMI EKS par défaut. Le DaemonSet ci-dessous les télécharge et installe.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
