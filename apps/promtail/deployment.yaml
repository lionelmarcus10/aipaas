# Promtail — Log shipper (DaemonSet)
#
# Runs on every node. Tails all container stdout/stderr logs
# from /var/log/pods/ and pushes them to Loki.
#
# Labels every log line with:
#   - namespace
#   - pod_name
#   - container_name
#   - app (from pod labels)
#
# Query in Grafana:
#   {namespace="financial-dispute-agent"}          # all agent logs
#   {app="financial-dispute-agent"} |= "workflow"  # filter by keyword
#   {app="vllm"} |= "error"                         # vLLM errors
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.10
          args:
            - -config.file=/etc/promtail/promtail.yaml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp/positions
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # --- Kubernetes pod logs ---
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Parse JSON logs if the container outputs JSON
          - json:
              expressions:
                level: level
                msg: msg
              source: log
              on_missing: skip
        relabel_configs:
          # Namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # Pod name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod_name
          # Container name
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container_name
          # App label (from pod labels)
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          # Only scrape pods (not host logs)
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: .+
          # Set the log file path
          # /var/log/pods/<namespace>_<pod-name>_<pod-uid>/<container-name>/*.log
          - target_label: __path__
            source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            regex: (.+)/(.+)/(.+)/(.+)
            replacement: /var/log/pods/${1}_${2}_${3}/${4}/*.log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
